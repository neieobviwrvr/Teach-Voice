name: TeachVoice
options:
  bundleIdPrefix: com.simonweinmann
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0

targets:
  TeachVoice:
    type: application
    platform: iOS
    sources:
      - path: Sources/TeachVoice
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Teach (Voice)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: >-
          Teach (Voice) benötigt Mikrofonzugriff, um deine gesprochene Antwort
          auf eine Karteikartenfrage aufzunehmen und lokal zu transkribieren.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonweinmann.teachvoice
        # Bewusst OHNE Leerzeichen/Klammern (anders als der App-Name auf dem
        # Homescreen, der weiterhin über CFBundleDisplayName unten separat
        # "Teach (Voice)" heißt): XcodeGens automatisch generierter
        # TEST_HOST-Pfad fürs Test-Target nutzt den reinen Target-Namen
        # ("TeachVoice"), nicht den PRODUCT_NAME – ein Mismatch hier war die
        # eigentliche Ursache von "Could not find test host" (nicht Timing/
        # Scheme-Struktur, wie in den vorherigen CI-Läufen vermutet).
        PRODUCT_NAME: TeachVoice
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
    # Dokumentierter XcodeGen-Weg, um den Test-Ordner korrekt in das
    # Scheme des App-Targets einzubinden (statt ein Scheme händisch nachzubauen,
    # siehe die zwei fehlgeschlagenen CI-Läufe zuvor – TEST_HOST/BUNDLE_LOADER
    # manuell zu setzen war der falsche Ansatz: ein App-Target (kein Framework)
    # braucht für @testable import tatsächlich die Host-App-Kopplung).
    scheme:
      testTargets:
        - TeachVoiceTests
    dependencies:
      - package: WhisperKit
        product: WhisperKit

  TeachVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TeachVoiceTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: TeachVoice
