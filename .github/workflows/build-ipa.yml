name: Build Unsigned IPA

# WICHTIG: Läuft NUR bei manuellem Auslösen (workflow_dispatch), niemals bei
# push/PR. Wird bewusst nicht automatisch getriggert – nur auf explizites
# Kommando des Projekt-Owners.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # XcodeGen generates a project file whose format depends on the XcodeGen
      # version installed via Homebrew (always latest), which can be newer
      # than the runner's *default* selected Xcode. Explicitly select the
      # newest Xcode actually installed on the runner instead of hardcoding a
      # version, so this doesn't silently break again on the next runner image
      # bump. (This is what broke the first real build attempt: "future Xcode
      # project file format" on macos-14's default Xcode 15.4.)
      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Temporärer Diagnose-Schritt: der Test-Host-Fehler ("Could not find
      # test host") tritt trotz des dokumentierten scheme.testTargets-Wegs
      # weiterhin auf – bevor ein weiteres Mal blind an project.yml gedreht
      # wird, erstmal ansehen, was XcodeGen tatsächlich generiert hat.
      - name: Debug - print generated scheme
        run: |
          find TeachVoice.xcodeproj -iname "*.xcscheme" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project TeachVoice.xcodeproj

      # Nicht per Namen hardcodiert (z.B. "iPhone 15") – welche Simulator-
      # Namen/Runtimes verfügbar sind, hängt von der auf dem Runner
      # installierten Xcode-Version ab und ändert sich mit Runner-Image-
      # Updates. Dieselbe Lektion wie beim dynamischen Xcode-Select oben:
      # lieber zur Laufzeit ermitteln als eine Annahme fest verdrahten, die
      # beim nächsten Runner-Update wortlos bricht.
      - name: Find available iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      # Läuft VOR dem Archiv-Build und bricht den Workflow bei Fehlschlag
      # sofort ab (Standard-GitHub-Actions-Verhalten) – kein Sinn, eine IPA
      # zu bauen, wenn schon die Kernlogik-Tests rot sind.
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project TeachVoice.xcodeproj \
            -scheme TeachVoice \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project TeachVoice.xcodeproj \
            -scheme TeachVoice \
            -sdk iphoneos \
            -archivePath build/TeachVoice.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      # Sideloadly signiert die App beim Installieren selbst mit der Apple-ID
      # des Users neu – ein export via ExportOptions.plist (der ein
      # Apple-Developer-Zertifikat bräuchte) ist daher nicht nötig. Stattdessen
      # wird das unsignierte .app-Bundle direkt in eine IPA-Struktur gepackt.
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/TeachVoice.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr TeachVoice-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeachVoice-unsigned-ipa
          path: build/TeachVoice-unsigned.ipa
          retention-days: 30
